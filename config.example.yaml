app:
  name: InterviewCopilot
  theme_default: dark
  language: en
llm:
  provider: auto
  routing:
    enabled: true
    sticky_sessions: true
    max_retries: 15
    penalty_per_429: 3
    decay_interval_s: 120
    first_token_deadline_s: 5.0
  model: meta-llama/llama-3.1-8b-instruct
  code_model: google/gemini-2.5-flash
  vision_model: google/gemini-2.5-flash
  classifier_model: meta-llama/llama-3.1-8b-instruct
  live_model: llama-3.3-70b-versatile
  effort_dial: false
  live_max_tokens: 4000
  live_first_token_timeout: 10.0
  live_detailed: true
  # On-pod local generation floor (§2.1 T4) — the never-empty routing ladder's
  # last rung. When enabled the app seeds an always-available local model that
  # needs no key and cannot be rate-limited, which is what makes "no route
  # available" structurally impossible rather than merely unlikely.
  #
  # This block was ABSENT from the shipped defaults, so a pod that got its
  # config from here never gained the rung: the GPU model could be installed and
  # running while the router had no way to reach it.
  local:
    enabled: true
    model_id: qwen3-4b-instruct
    base_url: http://127.0.0.1:8081/v1
    small_model_id: ''
  base_url: http://localhost:11434
  openrouter_api_key: ''
  openrouter_base_url: https://openrouter.ai/api/v1
  nvidia_api_key: ''
  nvidia_base_url: https://integrate.api.nvidia.com/v1
  temperature: 0.3
  max_tokens: 10000
  timeout_seconds: 120.0
  fallback_model: null
  stream_guard: true
  stream_max_chars: 120000
  repetition_max_repeats: 3
  chat_stream_budget_s: 300.0
embeddings:
  provider: sentence_transformers
  model: BAAI/bge-m3
  device: cpu
vector_store:
  provider: pgvector
  collection: resumes
  persist_dir: ./data/vectors
reranker:
  enabled: true
  model: BAAI/bge-reranker-base
rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k_retrieve: 20
  top_k_rerank: 5
  hybrid_search: true
stt:
  mode: local
  cloud_model: whisper-large-v3-turbo
  provider: faster_whisper
  fallback_providers: []
  model: large-v3
  device: cpu
  compute_type: float16
  language: null
  beam_size: 1
  cpu_threads: 4
  qwen_model: Qwen/Qwen3-ASR-1.7B
  qwen_language: null
  parakeet_model: nemo-parakeet-tdt-0.6b-v3
  parakeet_quantization: int8
  parakeet_use_gpu: true
  # Partial (streaming) STT engine. 'faster_whisper' + partial_model below is the
  # default. For the FASTEST partials, set 'parakeet' — Parakeet TDT v3 (~8x
  # realtime, multilingual) is now baked with onnxruntime-gpu (Gap 3); it ignores
  # partial_model and streams via its own engine.
  partial_provider: faster_whisper
  # A3: lighter model for streaming partials (fast caption + earlier speculation);
  # the final pass still uses large-v3. 'small' is multilingual + ~3-4x faster and
  # adds ~1GB VRAM. Set '' to reuse large-v3 for partials. Ignored when
  # partial_provider is 'parakeet'.
  partial_model: small
  final_from_partial: true
  dual_engine_enabled: false
  secondary_provider: null
  vocab_boost_enabled: true
  hotwords_enabled: true
  cloud_chain: null
  prompt: A technical software-engineering interview. The interviewer asks clear questions about computer science, programming, and system design.
vision:
  enabled: true
  mode: local
  cloud_max_side: 1568
  cloud_jpeg_quality: 85
  cloud_max_tokens: 1000
  cloud_retries: 3
  cloud_attempt_timeout: 28.0
  ocr_min_side: 1600
  ocr_max_side: 2600
  vision_latency_weight: 0.2
  code_prompt: 'This is a screenshot of a coding site or IDE (e.g. LeetCode, HackerRank, VS Code). Your reply MUST BEGIN with one line exactly: ''Language: <name>''. Determine <name> by reading the editor''s LANGUAGE SELECTOR — a small dropdown/label at the TOP of the code editor panel (often top-left or top-right, shown next to a small chevron ''⌄'', lock, or ''Auto'', e.g. ''Swift'', ''Java'', ''Python3'', ''C++'', ''Dart'', ''Go''). Read that chip EXACTLY — do NOT guess and do NOT assume Python. Look carefully even if the chip is small. If no selector is visible at all, infer the language from the starter-code syntax and the file extension and name your best reading. After that first line, transcribe ONLY the coding problem and its code editor — the problem statement, the examples/constraints, and the code stub verbatim (preserve the exact class/method names, types and signature). IGNORE everything unrelated: the desktop, taskbar, browser tabs/chrome, other windows, menus, and side panels — do not describe them. Be concise: no commentary. Do NOT write, complete, translate, fix, or invent any code, and do NOT solve the problem — only transcribe the problem and its starter code.'
  cloud_difficulty: trivial
  # 24GB pod: the CAPABLE model reads languages/code accurately on its own, so
  # it's primary (small SmolVLM-500M kept only as a light fallback). This is the
  # fix for the "Dart screenshot solved as C#" class of bug in local mode.
  provider: qwen2_5_vl
  fallback_providers:
  - smolvlm_500m
  smolvlm_small_model: HuggingFaceTB/SmolVLM-500M-Instruct
  smolvlm_model: HuggingFaceTB/SmolVLM-Instruct
  qwen_vl_model: Qwen/Qwen2.5-VL-3B-Instruct
  # 8-bit load (~3.5GB vs ~7GB fp16) so the 3B VLM COEXISTS on 24GB with the
  # 14B local LLM (~10GB) + Whisper large-v3 (~3GB) — ~17GB total, safe headroom.
  qwen_vl_load_8bit: true
  minicpm_model: openbmb/MiniCPM-V-2_6
  use_gpu: true
  # CAP, not a target (generation stops at EOS — short outputs pay nothing).
  # 512 truncated long problem transcriptions mid-examples, which is exactly the
  # inputs/expected-output section the solver needs.
  max_new_tokens: 1000
  ocr_enabled: true
  ocr_provider: rapid_ocr
  cache_enabled: true
  cache_max_entries: 128
  prompt: Transcribe all text in this image exactly as written, in reading order. Preserve layout with markdown — tables for tables, fenced code blocks for code. If a programming language is shown or selected (a language selector, a code editor, or code), name that language explicitly. If a non-text visual is present (chart, diagram, photo, UI control), add one short line naming it and what it shows. Output only what is visibly present. Do NOT summarize, analyze, answer, calculate, explain, or invent anything not shown.
audio:
  source: system_loopback
  sample_rate: 16000
  chunk_ms: 200
  vad: silero
  vad_threshold: 0.5
  # Base end-of-speech gap. The segmenter scales this DOWN for a partial that
  # already reads as a complete question (~base*0.55) and UP for short/incomplete
  # ones, so lowering the base speeds the common "clear question then pause" case
  # (~300ms endpoint) without chopping mid-thought pauses (those still wait ~1.2s).
  endpoint_silence_ms: 550
  min_utterance_ms: 700
  short_utterance_gap_ms: 1200
  max_utterance_ms: 15000
  partial_min_ms: 400
  partial_interval_ms: 500
  end_partial_trailing_ms: 160
  incomplete_gap_ms: 1200
  preroll_ms: 240
  vad_reentry_window_ms: 3000
  vad_reentry_delta: 0.15
